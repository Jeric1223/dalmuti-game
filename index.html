<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>달무티 왕궁</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: one-screen card table — court roster on top, the trick in the middle, your hand anchored at the bottom, court log at the side on wide screens */
:root{
  --bg:#1c0e11; --felt:#2a1418; --surface:#3a1d22; --line:#5b3339;
  --gold:#d9b45f; --gold-dim:#8f7442;
  --ivory:#f2e9d4; --ink:#2a1a1c;
  --text:#f1e3cb; --muted:#b39888;
  --ok:#8cc79a; --bad:#e2765f;
  --f-display:'IM Fell English SC','Gowun Batang',Georgia,serif;
  --f-ko:'Gowun Batang','Nanum Myeongjo',Georgia,serif;
  --f-ui:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --cw:56px; --ch:82px;
  --op:1;
  color-scheme:dark;
}
.app,.modal,.toast{opacity:var(--op); transition:opacity .2s}
html.ghost .app, html.ghost .modal, html.ghost .toast{opacity:.03}
body{transition:background-color .2s}
html.faded body{background:var(--bg)}
.opbox{display:inline-flex; align-items:center; gap:6px}
.opbox input{width:96px; accent-color:var(--gold)}
.opbox output{font-size:11px; color:var(--muted); width:30px; font-variant-numeric:tabular-nums}
@media (min-width:720px){ :root{ --cw:70px; --ch:102px; } }
html,body{height:100%}
body{background:var(--bg) radial-gradient(ellipse at 50% 30%, #3a1a20 0%, var(--bg) 70%) fixed; color:var(--text); font-family:var(--f-ui); font-size:14px;}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

.app{min-height:100%; max-width:1200px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr); gap:12px;
  padding-block:12px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));}
@media (min-width:960px){ .app{grid-template-columns:minmax(0,1fr) 260px; grid-template-rows:auto 1fr;} .top{grid-column:1/-1} }

.top{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; justify-content:space-between}
.brand{display:flex; align-items:baseline; gap:10px}
.brand h1{margin:0; font-family:var(--f-display); font-weight:400; font-size:28px; letter-spacing:.04em; color:var(--gold)}
.brand span{font-family:var(--f-ko); color:var(--muted); font-size:13px}
.ctrl{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.seg button{background:none; border:0; padding:6px 11px; cursor:pointer; color:var(--muted); font-size:12px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--gold)}
.lbl{font-size:11px; letter-spacing:.08em; color:var(--muted)}

.btn{border:1px solid var(--gold-dim); background:var(--surface); padding:9px 18px; border-radius:999px; cursor:pointer; font-weight:500; transition:background .15s, opacity .15s}
.btn:hover:not(:disabled){background:#4a262c}
.btn:disabled{opacity:.38; cursor:not-allowed}
.btn.primary{background:var(--gold); color:var(--ink); border-color:var(--gold)}
.btn.primary:hover:not(:disabled){background:#e8c672}
.btn.sm{padding:6px 12px; font-size:12px}

.board{display:flex; flex-direction:column; gap:12px; min-width:0}

.seats{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px}
.seat{background:rgba(58,29,34,.65); border:1px solid var(--line); border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; gap:5px; min-width:0; transition:border-color .2s, box-shadow .2s}
.seat.turn{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 0 18px rgba(217,180,95,.25)}
.seat.done{opacity:.55}
.seat-top{display:flex; justify-content:space-between; align-items:center; gap:6px}
.nm{font-family:var(--f-ko); font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.badge{font-size:10.5px; padding:2px 7px; border-radius:4px; white-space:nowrap; background:#2a1418; color:var(--muted); border:1px solid var(--line)}
.badge.r0{background:var(--gold); color:var(--ink); border-color:var(--gold)}
.badge.r1{color:var(--gold); border-color:var(--gold-dim)}
.badge.rp{color:var(--bad); border-color:#7a3a33}
.seat-mid{display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px}
.backs{display:inline-flex}
.back{width:11px; height:16px; border-radius:2px; background:repeating-linear-gradient(45deg,#6e2630 0 3px,#561c25 3px 6px); border:1px solid var(--gold-dim); margin-left:-5px}
.back:first-child{margin-left:0}
.seat-act{min-height:30px; display:flex; align-items:center; gap:3px; font-size:12px; color:var(--muted); flex-wrap:wrap}
.pass{color:var(--muted); font-style:italic; font-family:var(--f-ko)}
.think{color:var(--gold)}
.mini{display:inline-grid; place-items:center; width:20px; height:28px; border-radius:3px; background:var(--ivory); color:var(--h); font-family:var(--f-display); font-size:13px; border-top:5px solid var(--h); line-height:1}

.table{position:relative; min-height:200px; border-radius:110px / 70px; background:radial-gradient(ellipse at 50% 40%, #3d1c22 0%, var(--felt) 75%); border:1px solid var(--line); box-shadow:inset 0 0 40px rgba(0,0,0,.45); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px 16px}
.pile{display:flex; justify-content:center; flex-wrap:wrap; gap:0; min-height:var(--ch)}
.pile .card{position:relative; margin-left:calc(var(--cw) * -0.45); cursor:default; animation:drop .25s ease-out}
.pile .card:first-child{margin-left:0}
.pile.clearing{opacity:.35; transition:opacity .4s}
@keyframes drop{from{transform:translateY(-14px); opacity:0} to{transform:none; opacity:1}}
.pile-label{font-family:var(--f-ko); color:var(--text); text-align:center; font-size:14px}
.pile-label b{color:var(--gold); font-weight:700}
.pile-sub{color:var(--muted); font-size:12px; text-align:center}
.empty-pile{width:var(--cw); height:var(--ch); border:1.5px dashed var(--gold-dim); border-radius:7px; display:grid; place-items:center; color:var(--gold-dim); font-family:var(--f-display); font-size:22px}

.me{background:rgba(42,20,24,.8); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0}
.me.turn{border-color:var(--gold)}
.me-info{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; justify-content:space-between}
.me-info .who{display:flex; align-items:center; gap:8px}
.score{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
.status{font-family:var(--f-ko); font-size:15px; min-height:22px}
.status b{color:var(--gold)}
.hand{position:relative; height:calc(var(--ch) + 16px); width:100%}
.card{width:var(--cw); height:var(--ch); border-radius:7px; background:var(--ivory); color:var(--ink); border:1px solid #c9b994; box-shadow:0 2px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.35); overflow:hidden; user-select:none; -webkit-user-select:none; flex:none}
.hand .card{position:absolute; top:14px; cursor:pointer; transition:top .14s, filter .14s}
.hand .card:hover{top:9px}
.hand .card.sel{top:0; box-shadow:0 0 0 2px var(--gold), 0 10px 18px rgba(0,0,0,.45)}
.hand .card.dim{filter:saturate(.25) brightness(.55); cursor:default}
.hand .card.dim:hover{top:14px}
.card::before{content:""; position:absolute; left:0; right:0; top:0; height:22%; background:var(--h)}
.card.jester::before{background:repeating-linear-gradient(45deg,#b23a3a 0 5px,#2f6d95 5px 10px,#d9b45f 10px 15px)}
.cn{position:absolute; top:2px; left:5px; font-family:var(--f-display); font-size:calc(var(--cw) * .25); color:#fff; line-height:1.1; z-index:1; text-shadow:0 1px 0 rgba(0,0,0,.3)}
.cc{position:absolute; inset:22% 0 18% 0; display:grid; place-items:center; font-family:var(--f-display); font-size:calc(var(--cw) * .6); color:var(--h); line-height:1}
.jester .cc{color:#8e2f5a}
.cr{position:absolute; bottom:4px; left:0; right:0; text-align:center; font-family:var(--f-ko); font-size:calc(var(--cw) * .165); color:#6b574b; white-space:nowrap}
.fresh::after{content:""; position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 2px var(--ivory)}
.actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.actions .spacer{flex:1}
.hint{font-size:12px; color:var(--muted)}

.log{background:rgba(42,20,24,.55); border:1px solid var(--line); border-radius:12px; padding:12px 14px; min-width:0; max-height:none}
.log h2{margin:0 0 8px; font-family:var(--f-ko); font-size:13px; letter-spacing:.06em; color:var(--gold); font-weight:700}
.log ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; max-height:180px; overflow:auto; font-size:12.5px; color:var(--muted); line-height:1.45}
@media (min-width:960px){ .log ol{max-height:calc(100vh - 140px)} }
.log li.k-big{color:var(--gold)}
.log li.k-me{color:var(--text)}
.log li.k-round{color:var(--text); font-family:var(--f-ko); font-weight:700; padding-top:6px; border-top:1px solid var(--line)}

.modal{position:fixed; inset:0; background:rgba(14,6,8,.72); display:grid; place-items:center; z-index:50; padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); overflow:auto}
.panel{background:var(--surface); border:1px solid var(--gold-dim); border-radius:14px; padding:22px; width:100%; max-width:480px; display:flex; flex-direction:column; gap:14px; box-shadow:0 20px 50px rgba(0,0,0,.5)}
.panel h2{margin:0; font-family:var(--f-ko); font-size:22px; color:var(--gold); text-wrap:balance}
.panel p{margin:0; line-height:1.6; color:var(--text)}
.panel .muted{color:var(--muted); font-size:13px}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:12px; color:var(--muted); letter-spacing:.04em}
.field input{background:var(--felt); border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--text); font:inherit}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chips button{width:44px; height:40px; border-radius:8px; border:1px solid var(--line); background:var(--felt); cursor:pointer; font-family:var(--f-display); font-size:18px}
.chips button[aria-pressed="true"]{border-color:var(--gold); color:var(--gold); background:#4a262c}
.row-end{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.rank-tbl{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.rank-tbl td{padding:7px 4px; border-bottom:1px solid var(--line)}
.rank-tbl td:first-child{font-family:var(--f-display); color:var(--gold); width:28px}
.rank-tbl td.r{text-align:right; color:var(--muted)}
.rank-tbl td.r b{color:var(--text)}
.rules{display:flex; flex-direction:column; gap:10px; max-height:60vh; overflow:auto; padding-right:4px}
.rules h3{margin:4px 0 0; font-family:var(--f-ko); font-size:15px; color:var(--gold)}
.rules p,.rules li{font-size:13.5px; line-height:1.65; color:var(--text)}
.rules ul{margin:0; padding-left:18px}
.deckrow{display:flex; flex-wrap:wrap; gap:4px}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--gold); color:var(--ink); padding:10px 18px; border-radius:999px; font-family:var(--f-ko); font-weight:700; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.45); max-width:calc(100% - 32px); text-align:center}
.tag{margin-left:auto; font-size:10.5px; color:var(--muted); border:1px dashed var(--line); padding:1px 6px; border-radius:4px; white-space:nowrap}
.roomcode{display:flex; align-items:baseline; gap:12px}
.roomcode b{font-family:var(--f-display); font-size:40px; font-weight:400; letter-spacing:.18em; color:var(--gold)}
.members{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:6px}
.members li{display:flex; align-items:center; justify-content:space-between; gap:6px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--felt); min-width:0}
.members li.empty{border-style:dashed; background:none; color:var(--muted); font-size:12px}
.link{font-family:ui-monospace,monospace; font-size:12px; color:var(--text); word-break:break-all}
.code-in{text-transform:uppercase; letter-spacing:.2em}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Dalmuti</h1><span id="roundLbl">달무티 왕궁</span></div>
    <div class="ctrl">
      <span class="opbox" title="Esc: 즉시 숨기기 / 다시 보이기"><label class="lbl" for="opRange">투명도</label><input type="range" id="opRange" min="10" max="100" step="5" value="100"><output id="opVal">100%</output></span>
      <span class="lbl" id="speedLbl">속도</span>
      <div class="seg" id="speedSeg">
        <button data-s="1000">느림</button><button data-s="600" aria-pressed="true">보통</button><button data-s="280">빠름</button>
      </div>
      <button class="btn sm" id="rulesBtn">규칙</button>
      <button class="btn sm" id="newBtn">새 게임</button>
    </div>
  </header>
  <main class="board">
    <section class="seats" id="seats" aria-label="다른 플레이어"></section>
    <section class="table" id="table" aria-live="polite"></section>
    <section class="me" id="me">
      <div class="me-info"><div class="who" id="meWho"></div><div class="score" id="meScore"></div></div>
      <div class="status" id="status"></div>
      <div class="hand" id="hand"></div>
      <div class="actions" id="actions"></div>
    </section>
  </main>
  <aside class="log"><h2>궁정 기록</h2><ol id="log"></ol></aside>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="engine.js"></script>
<script>
const {createGame,isValid,shuffle,titleFor,vLabel,cardsStr,BOT_NAMES}=Dalmuti;
const ROLE=['','달무티','대주교','원수','남작부인','수녀원장','기사','재봉사','석공','요리사','양치기','채석공','농노','광대'];
const HUE=['','#6b3fa0','#9a2f5e','#b23a3a','#c4622d','#a87a1f','#6f7d22','#3f8a52','#2a7f7a','#2f6d95','#3c4f9c','#5d5a72','#7a6650','#8e2f5a'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// V: 지금 그리는 상태(싱글은 game.view(0), 멀티는 서버가 보낸 view). game: 싱글 엔진. MP: 멀티 연결
let V=null, game=null, MP=null, speed=600, sel=new Set(), token=0, setupN=5, setupMode='single', myName='나', toastT=null, seen='';
// 멀티 서버 주소. 비워두면 이 페이지를 띄운 서버(npm start)로 접속. 화면을 GitHub Pages 등에 따로 올릴 땐 'wss://서버주소'를 넣는다
const SERVER_URL='';
const canMulti=!!SERVER_URL||location.protocol.startsWith('http');

function later(fn,ms){const t=token; setTimeout(()=>{ if(t===token) fn(); }, ms);}
function badgeCls(pos,n){return pos===0?'r0':pos===1?'r1':pos>=n-2?'rp':'';}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function posOf(id){return V.order.indexOf(id);}

/* ---------- 싱글 ---------- */
function startGame(n,name){
  leaveRoom();
  token++; sel.clear();
  const seats=[{name:name||'나',human:true}].concat(shuffle(BOT_NAMES.slice()).slice(0,n-1).map(nm=>({name:nm})));
  const g=createGame(seats,{later, speed:()=>speed, changed:()=>{V=g.view(0);render();}, toast:(msg,to)=>{ if(to==null||to===0) toast(msg); }});
  game=g; closeModal(); g.start();
}
// 사람 입력은 전부 여기로 — 싱글은 엔진에 바로, 멀티는 서버로
function send(t,d={}){
  if(MP) return wsSend({t,...d});
  if(!game) return;
  ({play:()=>game.play(0,d.ids), pass:()=>game.play(0,null), tax:()=>game.taxReturn(0,d.ids), rev:()=>game.revolution(0,d.call), next:()=>game.nextRound()})[t]();
}

/* ---------- 멀티 ---------- */
// 재접속 때 같은 자리를 찾기 위한 브라우저 식별자
const SID=(()=>{
  const mk=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');
  try{let s=localStorage.getItem('dalmuti-sid'); if(!s){s=mk();localStorage.setItem('dalmuti-sid',s);} return s;}catch(_){return mk();}
})();
function wsSend(m){ if(MP&&MP.ws.readyState===WebSocket.OPEN) MP.ws.send(JSON.stringify(m)); }
function joinRoom(hello){ // hello: {t:'create',n,name} | {t:'join',code,name}
  leaveRoom(); token++; game=null;
  MP={hello,retry:0,code:null,host:false,room:null};
  openSocket();
}
function openSocket(){
  const ws=new WebSocket(SERVER_URL||(location.protocol==='https:'?'wss://':'ws://')+location.host);
  MP.ws=ws;
  ws.onopen=()=>{ MP.retry=0; ws.send(JSON.stringify({...MP.hello,sid:SID})); };
  ws.onmessage=e=>onServer(JSON.parse(e.data));
  ws.onclose=()=>{
    if(!MP||MP.ws!==ws) return;
    if(MP.code&&MP.retry<5){ MP.retry++; toast('연결이 끊겼습니다 — 다시 연결하는 중…'); return setTimeout(()=>{ if(MP&&MP.ws===ws) openSocket(); },1500*MP.retry); }
    toast('서버에 연결할 수 없습니다'); leaveRoom(); openSetup();
  };
}
function onServer(m){
  if(!MP) return;
  if(m.t==='room'){
    Object.assign(MP,{code:m.code,host:m.host,room:m,hello:{t:'join',code:m.code,name:MP.hello.name}});
    try{localStorage.setItem('dalmuti-room',JSON.stringify({code:m.code,name:MP.hello.name}));}catch(_){}
    if(!m.started) openLobby(); else render();
  } else if(m.t==='state'){
    V=m.view; if(modalKind==='lobby') closeModal(); render();
  } else if(m.t==='toast') toast(m.msg);
  else if(m.t==='error'){ toast(m.msg); if(m.fatal){ leaveRoom(); openSetup(); } }
}
function leaveRoom(){
  if(!MP) return;
  const ws=MP.ws; MP=null; V=null;
  try{localStorage.removeItem('dalmuti-room');}catch(_){}
  ws.onclose=null; if(ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({t:'leave'})); ws.close();
}

/* ---------- 사람 입력 ---------- */
function canAct(){return V&&V.phase==='play'&&V.turn===V.me&&!V.clearing;}
function myTax(){return V&&V.phase==='taxReturn'&&V.taxCtx&&V.taxCtx.by===V.me;}
function playableValues(){
  const J=V.hand.filter(c=>c.v===13).length, cnt={};
  V.hand.forEach(c=>{if(c.v!==13)cnt[c.v]=(cnt[c.v]||0)+1;});
  const ok=new Set();
  if(!V.pile){ V.hand.forEach(c=>ok.add(c.v)); return ok; }
  Object.keys(cnt).map(Number).forEach(v=>{ if(v<V.pile.value && cnt[v]+J>=V.pile.count) ok.add(v); });
  if(ok.size&&J) ok.add(13);
  return ok;
}
function tapCard(id){
  const hand=V.hand, c=hand.find(x=>x.id===id); if(!c) return;
  if(myTax()){
    if(sel.has(id)) sel.delete(id); else { sel.add(id); if(sel.size>V.taxCtx.k) sel.delete(sel.values().next().value); }
    return render();
  }
  if(!canAct()) return;
  if(sel.has(id)){ sel.delete(id); return render(); }
  if(!playableValues().has(c.v)) return;
  if(c.v!==13) for(const s of [...sel]){ const sc=hand.find(x=>x.id===s); if(sc&&sc.v!==13&&sc.v!==c.v) sel.delete(s); }
  sel.add(id);
  if(V.pile&&c.v!==13){
    const same=hand.filter(x=>x.v===c.v&&!sel.has(x.id));
    while(sel.size<V.pile.count&&same.length) sel.add(same.shift().id);
  }
  render();
}
function humanPlay(){
  if(!canAct()) return;
  const cards=V.hand.filter(c=>sel.has(c.id)); if(!isValid(cards,V.pile)) return;
  sel.clear(); send('play',{ids:cards.map(c=>c.id)}); render();
}
function humanPass(){ if(!canAct()||!V.pile)return; sel.clear(); send('pass'); render(); }
function confirmTaxReturn(){
  if(!myTax()) return;
  const ids=V.hand.filter(c=>sel.has(c.id)).map(c=>c.id); if(ids.length!==V.taxCtx.k) return;
  sel.clear(); send('tax',{ids}); render();
}

/* ---------- 렌더 ---------- */
function cardHTML(c,cls=''){
  const j=c.v===13;
  return `<div class="card ${j?'jester':''} ${cls}" data-id="${c.id}" style="--h:${HUE[c.v]}" role="button" tabindex="0" aria-label="${ROLE[c.v]} ${vLabel(c.v)}"><span class="cn">${j?'J':c.v}</span><span class="cc">${j?'✶':c.v}</span><span class="cr">${ROLE[c.v]}</span></div>`;
}
function mini(c){return `<span class="mini" style="--h:${HUE[c.v]}">${c.v===13?'J':c.v}</span>`;}
function render(){
  if(!V) return;
  // 라운드·단계가 바뀌면 선택 초기화, 손에서 빠진 카드는 선택에서 제거
  const key=V.round+'/'+V.phase; if(key!==seen){seen=key;sel.clear();}
  for(const id of [...sel]) if(!V.hand.some(c=>c.id===id)) sel.delete(id);
  $('#roundLbl').textContent=`${V.round}라운드 · ${V.n}인${MP?' · 방 '+MP.code:''}`;
  $('#speedLbl').style.display=$('#speedSeg').style.display=MP?'none':'';
  renderSeats(); renderTable(); renderMe(); renderLog(); renderModal();
}
function renderSeats(){
  const hi=V.order.indexOf(V.me), list=[];
  for(let k=1;k<V.n;k++) list.push(V.order[(hi+k)%V.n]);
  $('#seats').innerHTML=list.map(id=>{
    const p=V.players[id], pos=posOf(id), fin=V.finished.indexOf(id), la=V.lastAction[id];
    const turn=V.phase==='play'&&V.turn===id;
    let act='&nbsp;';
    if(fin>=0) act=`<span class="think">${fin+1}등으로 끝냄</span>`;
    else if(turn) act='<span class="think">고민 중…</span>';
    else if(la) act=la.pass?'<span class="pass">패스</span>':la.cards.map(mini).join('');
    const nb=Math.min(p.count,7);
    const tag=!MP?'':!p.human?'<span class="tag">AI</span>':p.ai?'<span class="tag">자리 비움</span>':'';
    return `<div class="seat ${turn?'turn':''} ${fin>=0?'done':''}">
      <div class="seat-top"><span class="nm">${esc(p.name)}</span><span class="badge ${badgeCls(pos,V.n)}">${titleFor(pos,V.n)}</span></div>
      <div class="seat-mid"><span class="backs">${'<span class="back"></span>'.repeat(nb)}</span><span>${p.count}장</span>${tag}</div>
      <div class="seat-act">${act}</div></div>`;
  }).join('');
}
function renderTable(){
  const t=$('#table');
  if(V.pile){
    const by=V.players[V.pile.by];
    t.innerHTML=`<div class="pile ${V.clearing?'clearing':''}">${V.pile.cards.map(c=>cardHTML(c)).join('')}</div>
      <div class="pile-label"><b>${esc(by.name)}</b> · ${V.pile.count}장 · ${vLabel(V.pile.value)}</div>
      <div class="pile-sub">${V.clearing?'모두 패스 — 판을 정리합니다':`이기려면 같은 ${V.pile.count}장, ${V.pile.value===1?'더 낼 수 없음':V.pile.value-1+' 이하 숫자'}`}</div>`;
  } else {
    const msg={deal:'카드를 나누는 중…',revolution:'광대 두 장이 나왔습니다',tax:'세금을 걷는 중…',taxReturn:'세금 정산 중',roundEnd:'라운드가 끝났습니다'}[V.phase];
    const leader=V.phase==='play'&&V.turn!=null?`${esc(V.players[V.turn].name)}의 선 — 원하는 숫자를 원하는 장수만큼`:'';
    t.innerHTML=`<div class="empty-pile">✶</div><div class="pile-label">${msg||leader}</div><div class="pile-sub">숫자가 작을수록 강합니다 · 1이 최강, 12가 최약</div>`;
  }
}
function renderMe(){
  const me=V.players[V.me], hand=V.hand, pos=posOf(V.me), fin=V.finished.indexOf(V.me), myTurn=canAct(), tax=myTax();
  $('#me').classList.toggle('turn',myTurn||tax);
  $('#meWho').innerHTML=`<span class="nm">${esc(me.name)}</span><span class="badge ${badgeCls(pos,V.n)}">${titleFor(pos,V.n)}</span><span class="score">${hand.length}장</span>`;
  $('#meScore').textContent=`누적 점수 ${me.score}`;
  let status='', acts='';
  const playable=myTurn?playableValues():null;
  if(tax){
    const k=V.taxCtx.k;
    status=`세금으로 <b>${cardsStr(V.taxCtx.give)}</b>을(를) 받았습니다. ${esc(V.players[V.taxCtx.to].name)}에게 돌려줄 카드 <b>${k}장</b>을 고르세요.`;
    acts=`<button class="btn primary" id="taxBtn" ${sel.size===k?'':'disabled'}>${k}장 돌려주기</button><span class="hint">${sel.size}/${k} 선택</span>`;
  } else if(V.phase==='play'){
    if(fin>=0) status=`<b>${fin+1}등</b>으로 손을 털었습니다. 남은 대결을 지켜보세요.`;
    else if(myTurn){
      if(!V.pile) status='<b>내 선</b> — 같은 숫자를 원하는 장수만큼 내세요. 광대는 아무 숫자에 붙일 수 있습니다.';
      else status= playable.size? `<b>내 차례</b> — ${V.pile.count}장, ${V.pile.value-1} 이하 숫자로 받아치거나 패스.` : '<b>내 차례</b> — 낼 수 있는 조합이 없습니다. 패스하세요.';
      const cards=hand.filter(c=>sel.has(c.id)), ok=isValid(cards,V.pile);
      acts=`<button class="btn primary" id="playBtn" ${ok?'':'disabled'}>${cards.length?cards.length+'장 내기':'내기'}</button>
        <button class="btn" id="passBtn" ${V.pile?'':'disabled'}>패스</button>
        <span class="spacer"></span>${sel.size?'<button class="btn sm" id="clearBtn">선택 해제</button>':''}`;
    } else status= V.clearing?'판을 정리하는 중…':`${esc(V.turn!=null?V.players[V.turn].name:'')} 차례입니다`;
  } else if(V.phase==='roundEnd') status='라운드가 끝났습니다.';
  else status={deal:'카드를 받는 중…',tax:'세금을 걷는 중…',taxReturn:'세금을 걷는 중…',revolution:'혁명 여부를 정하는 중…'}[V.phase]||'';
  $('#status').innerHTML=status; $('#actions').innerHTML=acts;
  $('#hand').innerHTML=hand.map(c=>{
    let cls=sel.has(c.id)?'sel':'';
    if(myTurn&&!playable.has(c.v)) cls+=' dim';
    if(V.fresh.includes(c.id)) cls+=' fresh';
    return cardHTML(c,cls);
  }).join('');
  layoutHand();
  $('#playBtn')?.addEventListener('click',humanPlay);
  $('#passBtn')?.addEventListener('click',humanPass);
  $('#clearBtn')?.addEventListener('click',()=>{sel.clear();render();});
  $('#taxBtn')?.addEventListener('click',confirmTaxReturn);
}
function layoutHand(){
  const el=$('#hand'), cards=[...el.children]; if(!cards.length) return;
  const W=el.clientWidth, cw=cards[0].offsetWidth, n=cards.length;
  const step=n>1?Math.min(cw+5,(W-cw)/(n-1)):0, total=step*(n-1)+cw, off=Math.max(0,(W-total)/2);
  cards.forEach((c,i)=>{c.style.left=(off+i*step)+'px';c.style.zIndex=i+1;});
}
function renderLog(){ $('#log').innerHTML=V.log.map(l=>`<li class="${l.kind?'k-'+l.kind:''}">${esc(l.msg)}</li>`).join(''); }

/* ---------- 모달 ---------- */
let modalKind=null;
function closeModal(){modalKind=null;$('#modal').hidden=true;$('#modal').innerHTML='';}
function renderModal(){
  if(modalKind) return;
  const m=$('#modal');
  if(V.phase==='revolution'&&V.revBy===V.me){
    const great=posOf(V.me)===V.n-1;
    m.innerHTML=`<div class="panel"><h2>${great?'대혁명을 일으킬까요?':'혁명을 일으킬까요?'}</h2>
      <p>광대 두 장이 모두 내 손에 들어왔습니다.</p>
      <p class="muted">${great?'대노예인 내가 혁명을 선언하면 신분 순서가 완전히 뒤집혀 내가 대달무티가 되고, 이번 라운드 세금도 없습니다.':'혁명을 선언하면 이번 라운드는 세금을 주고받지 않습니다. 신분은 그대로입니다.'}</p>
      <div class="row-end"><button class="btn" id="revNo">그냥 진행</button><button class="btn primary" id="revYes">${great?'대혁명!':'혁명!'}</button></div></div>`;
    m.hidden=false;
    $('#revNo').onclick=()=>send('rev',{call:false});
    $('#revYes').onclick=()=>send('rev',{call:true});
    return;
  }
  if(V.phase==='roundEnd'){
    const rows=V.order.map((id,i)=>{const p=V.players[id];
      return `<tr><td>${i+1}</td><td>${esc(p.name)}${id===V.me?' (나)':''}</td><td><span class="badge ${badgeCls(i,V.n)}">${titleFor(i,V.n)}</span></td><td class="r">+${V.n-1-i} · <b>${p.score}</b>점</td></tr>`;}).join('');
    const myRank=V.order.indexOf(V.me), canNext=!MP||MP.host;
    m.innerHTML=`<div class="panel"><h2>${V.round}라운드 결과</h2>
      <p>${myRank===0?'왕좌에 올랐습니다. 다음 라운드는 대달무티로 세금을 받습니다.':myRank>=V.n-2?'다음 라운드는 노예석입니다. 가장 좋은 카드를 세금으로 바쳐야 합니다.':'다음 라운드도 평민석에서 시작합니다.'}</p>
      <div style="overflow-x:auto"><table class="rank-tbl">${rows}</table></div>
      <p class="muted">나간 순서대로 다음 라운드 자리가 정해집니다.</p>
      <div class="row-end"><button class="btn" id="reNew">새 게임</button>${canNext?'<button class="btn primary" id="reNext">다음 라운드</button>':'<span class="hint">방장이 다음 라운드를 시작합니다…</span>'}</div></div>`;
    m.hidden=false;
    $('#reNext')&&($('#reNext').onclick=()=>send('next'));
    $('#reNew').onclick=()=>openSetup();
    return;
  }
  m.hidden=true; m.innerHTML='';
}
function openSetup(code=''){
  modalKind='setup'; const m=$('#modal');
  if(code) setupMode='multi';
  const multi=setupMode==='multi', off=multi&&!canMulti;
  const chips=[4,5,6,7,8].map(n=>`<button data-n="${n}" aria-pressed="${n===setupN}">${n}</button>`).join('');
  m.innerHTML=`<div class="panel"><h2>새 게임</h2>
    <div class="seg" id="modeSeg"><button data-m="single" aria-pressed="${!multi}">혼자 하기</button><button data-m="multi" aria-pressed="${multi}">같이 하기</button></div>
    <p class="muted">${multi?'방을 만들어 코드를 나눠 주거나, 받은 코드로 참가합니다. 빈자리는 AI가 채웁니다.':'나 혼자 AI 신하들과 겨룹니다. 첫 라운드 자리는 추첨으로 정해집니다.'}</p>
    ${off?'<p>같이 하기는 서버를 거쳐야 합니다. 터미널에서 <b>npm install</b> 후 <b>npm start</b>를 실행하고 <b>http://localhost:3000</b>으로 접속하세요.</p>':`
    <div class="field"><label for="nameIn">내 이름</label><input id="nameIn" maxlength="8" value="${esc(myName)}"></div>
    <div class="field"><label>인원 (${multi?'사람 + AI':'나 포함'})</label><div class="chips" id="nChips">${chips}</div></div>
    ${multi?`<div class="field"><label for="codeIn">받은 방 코드</label><input id="codeIn" class="code-in" maxlength="4" placeholder="ABCD" autocomplete="off" value="${esc(code)}"></div>`:''}`}
    <div class="row-end">${game||V?'<button class="btn" id="setCancel">취소</button>':''}${off?'':multi?'<button class="btn" id="joinGo">코드로 참가</button><button class="btn primary" id="createGo">방 만들기</button>':'<button class="btn primary" id="setGo">시작하기</button>'}</div></div>`;
  m.hidden=false;
  const nm=()=>(myName=$('#nameIn').value.trim()||'나');
  const join=()=>{ const c=$('#codeIn').value.trim().toUpperCase(); if(c.length!==4) return toast('방 코드 4자리를 입력하세요'); joinRoom({t:'join',code:c,name:nm()}); };
  m.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{ if($('#nameIn')) nm(); setupMode=b.dataset.m; openSetup(); });
  m.querySelectorAll('#nChips button').forEach(b=>b.onclick=()=>{setupN=+b.dataset.n;m.querySelectorAll('#nChips button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  $('#setGo')&&($('#setGo').onclick=()=>startGame(setupN,nm()));
  $('#createGo')&&($('#createGo').onclick=()=>joinRoom({t:'create',n:setupN,name:nm()}));
  $('#joinGo')&&($('#joinGo').onclick=join);
  $('#codeIn')&&$('#codeIn').addEventListener('keydown',e=>{ if(e.key==='Enter') join(); });
  $('#setCancel')&&($('#setCancel').onclick=()=>{closeModal();render();});
}
function openLobby(){
  modalKind='lobby'; const r=MP.room, m=$('#modal'), empty=r.n-r.members.length;
  const local=['localhost','127.0.0.1'].includes(location.hostname);
  m.innerHTML=`<div class="panel"><h2>대기실</h2>
    <div class="roomcode"><span class="lbl">방 코드</span><b>${esc(r.code)}</b></div>
    <p class="muted">${local?`친구는 서버 터미널에 찍힌 <b>http://IP${location.port?':'+location.port:''}</b> 주소로 접속해 이 코드를 입력하면 됩니다.`:`초대 링크: <span class="link">${esc(location.origin)}/?room=${esc(r.code)}</span>`}</p>
    <ul class="members">${r.members.map(x=>`<li><span class="nm">${esc(x.name)}</span>${x.host?'<span class="badge r0">방장</span>':''}</li>`).join('')}${'<li class="empty">빈자리 · AI</li>'.repeat(empty)}</ul>
    <p class="muted">${r.n}인 게임 · 지금 ${r.members.length}명 입장${empty?` · 시작하면 빈자리 ${empty}개는 AI가 채웁니다`:''}</p>
    <div class="row-end"><button class="btn" id="lobbyLeave">나가기</button>${r.host?'<button class="btn primary" id="lobbyStart">시작하기</button>':'<span class="hint">방장이 시작하기를 기다리는 중…</span>'}</div></div>`;
  m.hidden=false;
  $('#lobbyLeave').onclick=()=>{leaveRoom();openSetup();};
  $('#lobbyStart')&&($('#lobbyStart').onclick=()=>wsSend({t:'start'}));
}
function openRules(){
  modalKind='rules'; const m=$('#modal');
  const deck=[];for(let v=1;v<=13;v++)deck.push(`<span class="mini" style="--h:${HUE[v]}">${v===13?'J':v}</span>`);
  m.innerHTML=`<div class="panel"><h2>달무티 규칙</h2><div class="rules">
    <p>먼저 손을 터는 사람이 다음 라운드의 대달무티가 됩니다.</p>
    <h3>카드 80장</h3>
    <div class="deckrow">${deck.join('')}</div>
    <p>숫자 n은 n장씩 있습니다(1은 1장, 12는 12장). 광대(J) 2장은 따로 내면 13, 다른 숫자와 함께 내면 그 숫자로 취급됩니다. <b>숫자가 작을수록 강합니다.</b></p>
    <h3>진행</h3>
    <ul><li>대달무티가 첫 선. 같은 숫자 카드를 원하는 장수만큼 냅니다.</li>
    <li>다음 사람은 <b>같은 장수</b>로 <b>더 작은 숫자</b>를 내거나 패스합니다. 패스해도 다음 차례에 다시 낼 수 있습니다.</li>
    <li>나머지 모두가 연달아 패스하면 마지막으로 낸 사람이 새로 선을 잡습니다.</li></ul>
    <h3>신분과 세금</h3>
    <ul><li>대노예는 가장 좋은 카드 2장을 대달무티에게, 소노예는 1장을 소달무티에게 바칩니다.</li>
    <li>달무티들은 받은 만큼 아무 카드나 골라 돌려줍니다.</li></ul>
    <h3>혁명</h3>
    <ul><li>광대 2장을 모두 받은 사람은 혁명을 선언해 그 라운드 세금을 없앨 수 있습니다.</li>
    <li>대노예가 선언하면 <b>대혁명</b> — 신분 순서가 통째로 뒤집힙니다.</li></ul>
    <h3>점수</h3><p>라운드마다 1등은 (인원−1)점, 꼴찌는 0점을 받습니다.</p>
    </div><div class="row-end"><button class="btn primary" id="rulesOk">닫기</button></div></div>`;
  m.hidden=false;
  $('#rulesOk').onclick=()=>{ closeModal(); if(MP&&!V) openLobby(); else render(); };
}

/* ---------- 이벤트 ---------- */
$('#hand').addEventListener('click',e=>{const el=e.target.closest('.card');if(el)tapCard(+el.dataset.id);});
$('#hand').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();tapCard(+e.target.dataset.id);}});
$('#speedSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;speed=+b.dataset.s;document.querySelectorAll('#speedSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
$('#rulesBtn').onclick=openRules;
$('#newBtn').onclick=()=>openSetup();
/* 투명도 (회사 모드) */
function setOpacity(v){
  v=Math.max(10,Math.min(100,+v||100));
  document.documentElement.style.setProperty('--op',v/100);
  $('#opRange').value=v; $('#opVal').textContent=v+'%';
  try{localStorage.setItem('dalmuti-op',v);}catch(_){}
}
$('#opRange').addEventListener('input',e=>setOpacity(e.target.value));
try{const s=localStorage.getItem('dalmuti-op'); if(s) setOpacity(s);}catch(_){}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ document.documentElement.classList.toggle('ghost'); return; }
  if(document.documentElement.classList.contains('ghost')) return;
  if(modalKind||!$('#modal').hidden) return;
  if(e.key==='Enter'&&!e.target.classList.contains('card')) humanPlay();
  if(e.key==='p'||e.key==='P') humanPass();
});
window.addEventListener('resize',layoutHand);

startGame(5,myName);
// 새로고침 전에 방에 있었으면 다시 들어가고, 초대 링크(?room=)로 왔으면 참가 화면을 연다
let savedRoom=null; try{savedRoom=JSON.parse(localStorage.getItem('dalmuti-room'));}catch(_){}
const inviteCode=new URLSearchParams(location.search).get('room');
if(canMulti&&savedRoom?.code){ myName=savedRoom.name||myName; joinRoom({t:'join',code:savedRoom.code,name:myName}); }
else if(canMulti&&inviteCode) openSetup(inviteCode.trim().toUpperCase().slice(0,4));
</script>
